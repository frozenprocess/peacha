# preDNAT host firewall on a wildcard HostEndpoint on every node. preDNAT is
# evaluated on the entry node BEFORE kube-proxy DNAT, so the Deny matches the
# original external source CIDR (203.0.113.5) - the client's real address, not a
# rewritten service/pod IP. preDNAT requires applyOnForward and Ingress-only
# rules. The companion allow-forward GNP below keeps traffic that clears the
# preDNAT hook actually moving to the backend pod (the wildcard HEP would
# otherwise default-drop it).
apiVersion: projectcalico.org/v3
kind: HostEndpoint
metadata:
  name: fw-control-plane
  labels:
    role: forward-firewall
spec:
  node: policy-llm-control-plane
  interfaceName: "*"
  expectedIPs: ["172.18.0.2"]
---
apiVersion: projectcalico.org/v3
kind: HostEndpoint
metadata:
  name: fw-worker
  labels:
    role: forward-firewall
spec:
  node: policy-llm-worker
  interfaceName: "*"
  expectedIPs: ["172.18.0.3"]
---
apiVersion: projectcalico.org/v3
kind: GlobalNetworkPolicy
metadata:
  name: prednat-block-external-cidr
spec:
  selector: role == 'forward-firewall'
  preDNAT: true
  applyOnForward: true
  types:
    - Ingress
  ingress:
    - action: Deny
      source:
        nets: ["203.0.113.5/32"]
    - action: Allow
---
apiVersion: projectcalico.org/v3
kind: GlobalNetworkPolicy
metadata:
  name: prednat-allow-forward
spec:
  selector: role == 'forward-firewall'
  applyOnForward: true
  types:
    - Ingress
    - Egress
  ingress:
    - action: Allow
  egress:
    - action: Allow
