name: Publish editor image

# Builds the multi-stage scratch image (deploy/Dockerfile) and pushes it to
# GitHub Container Registry as ghcr.io/<owner>/peacha-editor:dev.
#
# Packages first published from a private repo are created PRIVATE by default;
# verify under the repo's Packages > peacha-editor > Package settings.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/peacha-editor
  TAG: dev

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # The telepathy submodule uses an HTTPS URL. actions/checkout
          # authenticates with this token. The default GITHUB_TOKEN is scoped to
          # THIS repo only - if telepathy is a
          # separate private repo, supply a PAT (repo scope) as a secret here:
          #   token: ${{ secrets.SUBMODULES_PAT }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
