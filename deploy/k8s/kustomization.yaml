apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The GHCR pull secret (ghcr-pull) is intentionally NOT here - it holds
# credentials and must be created out-of-band. See README.md.
#
# TLS is handled at the Cloudflare edge; the origin is HTTP-only on the shared
# gateway's :80 listener, so there is no Certificate or gateway patch here.
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
