# OAuth app credentials for the exam certification gate.
#
# This is a TEMPLATE - it holds no real values and is intentionally NOT listed
# in kustomization.yaml, because credential-bearing secrets are created
# out-of-band (same as ghcr-pull and peacha-session). Pick ONE of:
#
#   1. kubectl create secret (preferred - nothing sensitive ever in git):
#        kubectl -n peacha create secret generic peacha-oauth \
#          --from-literal=slack-client-id=… \
#          --from-literal=slack-client-secret=… \
#          --from-literal=github-client-id=… \
#          --from-literal=github-client-secret=…
#
#   2. copy to secret.yaml (gitignored), fill in, and apply:
#        cp secret.example.yaml secret.yaml   # then edit secret.yaml
#        kubectl apply -f secret.yaml
#
# stringData takes plain (unencoded) values; Kubernetes base64-encodes them for
# you. Only the providers you actually use need keys - the Deployment marks each
# secretKeyRef optional, so a missing key just disables that provider. (Add
# google-client-id / google-client-secret here the same way if you enable it.)
apiVersion: v1
kind: Secret
metadata:
  name: peacha-oauth
  namespace: peacha
type: Opaque
stringData:
  slack-client-id: "REPLACE_ME"
  slack-client-secret: "REPLACE_ME"
  github-client-id: "REPLACE_ME"
  github-client-secret: "REPLACE_ME"
