apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: peacha-editor
  namespace: peacha
  labels:
    app.kubernetes.io/name: peacha
spec:
  parentRefs:
    - name: <YOUR-GATEWAY-NAME>
      namespace: <YOUR-GATEWAY-NAMESPACE>
      sectionName: http
  hostnames:
    - <YOUR-HOSTNAME>
  rules:
    - backendRefs:
        - name: peacha-editor
          port: 8080
